name = "ai-campaign-builder-backend"
main = "src/index.ts"
compatibility_date = "2024-09-09"

# Workers Logs -- was NOT enabled, which meant console.log/console.error calls
# throughout this Worker (including vision.ts's per-step cascade failure logs
# and customer.ts's "vision scoring failed for submission X" catch-all) were
# never captured anywhere. Discovered while investigating a task_submissions
# row stuck with a permanently null ai_confidence_score -- there was no way to
# tell whether the vision cascade ran, failed, or was never triggered. This
# doesn't fix that specific failure by itself, but without it every future
# silent failure in this Worker (vision scoring or otherwise) stays invisible.
[observability]
enabled = true

# database_id below is a placeholder and is meant to stay one — CI's
# .github/actions/ensure-d1-database action idempotently looks this database
# up by name (creating it on first deploy only) and patches its OWN local
# checkout of this file with the real id before running wrangler commands.
# That patch is never committed back here. For local dev (`npm run dev` /
# `db:migrate:local`), this placeholder is fine as-is since --local mode
# uses a local sqlite file keyed by binding name, not this id.
[[d1_databases]]
binding = "DB"
database_name = "ai-campaign-builder-db"
database_id = "REPLACE_WITH_REAL_D1_DATABASE_ID"

# JWT_SECRET and any OTP/SMS provider secrets are set via `wrangler secret put`,
# not committed here. Same for the root review_admin identity:
#   wrangler secret put REVIEW_ADMIN_USERNAME
#   wrangler secret put REVIEW_ADMIN_PASSWORD_HASH   # a pbkdf2$... hash, not
#                                                     # a plaintext password --
#                                                     # generate one with
#                                                     # lib/password.ts's
#                                                     # hashPassword() locally
#                                                     # before deploying.
#
# Vision scoring adapter (lib/vision.ts, Open Item 1) -- all optional, same
# as REVIEW_ADMIN_* above: unset means scoring is silently skipped, not a
# deploy failure. Cascade order + which models to try live in
# src/lib/ai-models.config.ts (Google's models first, then OpenAI's --
# 2026-09-11 change; consolidated into this shared file with
# campaign-generator.ts's text cascade on 2026-09-12), NOT in a secret --
# these three just supply credentials per provider. Each *_API_KEYS secret is a COMMA-SEPARATED LIST of keys (one
# is picked at random per call for load/quota spreading across keys). A
# provider with no keys set here is skipped by the cascade, not an error:
#   wrangler secret put VISION_GOOGLE_API_KEYS    # "AIza...,AIza..."
#   wrangler secret put VISION_OPENAI_API_KEYS    # "sk-...,sk-..."
#   wrangler secret put VISION_ANTHROPIC_API_KEYS # "sk-ant-...,sk-ant-..." (unused by the
#                                                  # default cascade, but still supported by
#                                                  # vision.ts if added to the config file)
#
# Evidence storage (lib/storage.ts) -- backs task_submissions.evidence_url
# with a real uploaded file via Backblaze B2's native API (plan.md's
# "Evidence storage provider" decision). All FOUR required together --
# unlike VISION_*/REVIEW_ADMIN_* above, this isn't optional-and-silently-
# skipped: POST /api/customer/evidence-upload returns a hard 503 if any is
# missing, since an upload is a synchronous, user-initiated action expecting
# a real answer, not a background best-effort call. B2_BUCKET_ID and
# B2_BUCKET_NAME are both needed (the upload API takes the id; public
# download URLs are built from the name) -- both come from the B2 dashboard
# when the bucket is created, which must be configured for public-read
# access so vision.ts and Review Console can fetch/display the resulting
# URLs with no auth:
#   wrangler secret put B2_KEY_ID
#   wrangler secret put B2_APPLICATION_KEY
#   wrangler secret put B2_BUCKET_ID
#   wrangler secret put B2_BUCKET_NAME
