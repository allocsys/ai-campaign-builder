# Cloudflare Worker config for the public Microsite SSR renderer.
# Self-contained per plan.md "Deployment architecture" — 5 separate deployments,
# one per persona, each with its own wrangler.toml.
#
# UNLIKE the other 4 persona apps, this is NOT a static SPA: it's a public,
# multi-tenant, SEO-facing renderer that needs a live server-rendered response
# on every request (business content — e.g. featured_campaign_id — can change
# and must be fresh, not baked into a static build). Built with React Router v7
# in framework/SSR mode, deployed as an actual Cloudflare Worker (`main` entry
# point below), not [assets]-only static hosting like the SPA siblings.
#
# Data layer: real backend-backed as of 2026-09-11 (plan.md Phase 0.75
# "Backend-wiring scope decision") via the [[services]] binding below --
# app/lib/mock-data.ts's getMicrositeData() now calls apps/backend's public
# /api/public/microsites/:slug endpoint through this binding instead of
# returning fixtures. A service binding (not a public HTTPS URL) is used
# since both Workers already deploy to the same Cloudflare account -- avoids
# the public-internet hop/CORS/extra auth a URL-based call would need for
# what is otherwise an internal server-to-server call.
#
# Subdomain -> business resolution happens per-request in the root route's
# loader by reading the Host header (see app/routes/_index.tsx) — this is
# also why SSR is required rather than a static build per business.

name = "ai-campaign-builder-microsite"
compatibility_date = "2026-09-08"
compatibility_flags = ["nodejs_compat"]
main = "./workers/app.ts"

[assets]
directory = "./dist/client"
binding = "ASSETS"

# Service binding to apps/backend (name must match that Worker's `name` in
# apps/backend/wrangler.toml). Worker-to-worker call, not a public URL --
# see comment above.
[[services]]
binding = "BACKEND"
service = "ai-campaign-builder-backend"

# TODO before first real deploy: set `routes` or a custom domain once business
# domain/subdomain naming is decided (see plan.md Phase 5 "NEXT STEP" note —
# not yet decided as of 2026-09-09). This app in particular needs a WILDCARD
# route (e.g. "*.ourdomain.com/*") once the domain is chosen, since it must
# handle every business's subdomain, not one fixed host like the other apps.
