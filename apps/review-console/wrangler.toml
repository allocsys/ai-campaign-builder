# Cloudflare Worker config for the Review Console persona app.
# Self-contained per plan.md "Deployment architecture" — 5 separate deployments,
# one per persona, each with its own wrangler.toml.
#
# This is the internal-team-only persona (plan.md: "isolated for security /
# smaller attack surface, can sit behind extra auth later") — deployed
# separately from the public-facing apps for that reason, even though the
# build output shape (static SPA) is identical to the others for now.
#
# Build output is a static SPA (Vite build → dist/), served as static assets.
# No D1 binding here — this app talks to the backend API over HTTP; D1 is bound
# directly in apps/backend/wrangler.toml only (once the backend exists).

name = "ai-campaign-builder-review-console"
compatibility_date = "2026-09-08"

[assets]
directory = "dist"
# SPA fallback: without this, a hard refresh (or any direct navigation) on
# any client-side route other than "/" hits the Worker's static-assets
# handler directly, finds no file at that exact path, and 404s instead of
# handing off to the React Router app. This serves index.html for any
# unmatched path so client-side routing can take over.
not_found_handling = "single-page-application"

