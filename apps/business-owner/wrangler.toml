# Cloudflare Worker config for the Business Owner persona app.
# Self-contained per plan.md "Deployment architecture" — 5 separate deployments,
# one per persona, each with its own wrangler.toml.
#
# Build output is a static SPA (Vite build → dist/), served as static assets.
# No D1 binding here — this app talks to the backend API over HTTP; D1 is bound
# directly in apps/backend/wrangler.toml only (once the backend exists).

name = "ai-campaign-builder-business-owner"
compatibility_date = "2026-09-08"

[assets]
directory = "dist"
# SPA fallback: without this, a hard refresh (or any direct navigation) on
# any client-side route other than "/" 404s instead of handing off to the
# React Router app. Serves index.html for any unmatched path.
not_found_handling = "single-page-application"

# TODO before first real deploy: set `routes` or a custom domain once business
# domain/subdomain naming is decided (see plan.md Phase 5 "NEXT STEP" note —
# not yet decided as of 2026-09-08).
