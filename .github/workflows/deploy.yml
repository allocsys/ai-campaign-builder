# CI + deploy for the persona apps in this monorepo, each built and deployed
# independently from its own apps/* folder (see plan.md Phase 5 "Deployment
# architecture"). Pattern adapted directly from allocsys/raffle-app's
# deploy.yml (verified 2026-09-08) — same path-filtered-per-app shape, scaled
# from raffle-app's 2 frontend apps + backend to this repo's eventual 5
# frontend apps + backend.
#
# npm workspaces (added 2026-09-08, root package.json workspaces: apps/*,
# packages/*): unlike raffle-app, each app here can depend on shared code in
# packages/* (e.g. packages/ui-kit). This means `npm ci`/`npm run <script>`
# must run from the REPO ROOT (not `defaults.run.working-directory` inside
# the app folder, as raffle-app does) so npm can resolve and symlink
# workspace packages — scripts target a specific app via `--workspace=`.
#
# STATUS (2026-09-09): `business-owner`, `customer`, `staff-pos`,
# `review-console`, and `microsite` are scaffolded, so all five jobs are
# wired up below. `microsite` is a real SSR Cloudflare Worker (React Router
# v7), not a static SPA like the other four — its job still fits the same
# build/test/deploy shape since `npm run build`/`npm run deploy` in its
# package.json abstract that difference away.
#
# STATUS (2026-09-10): `backend` (apps/backend, scaffolded on branch
# backend-scaffold) is wired up as two jobs instead of one, per plan.md's D1
# decision and the migration-gating/secret-presence requirement:
#   - `backend-migrate`: runs `wrangler d1 migrations apply ... --remote`
#     against the D1 binding, gated on its OWN narrower path filter
#     (apps/backend/migrations/**) so a migration-only change doesn't wait on
#     unrelated backend code changes, and vice versa. Skipped entirely on
#     pull_request (migrations only run on an actual deploy trigger).
#   - `backend`: typecheck+test (all triggers) then deploy (push/dispatch
#     only), but only proceeds to deploy once `backend-migrate` has either
#     succeeded or been skipped (`always()` + explicit result check) — never
#     deploys code against a database that a pending migration failed against.
#     Also fails fast with a clear message before attempting to deploy if
#     CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / BACKEND_JWT_SECRET aren't
#     set as repo secrets, then pushes BACKEND_JWT_SECRET to the Worker as its
#     JWT_SECRET binding via `wrangler secret put` after a successful deploy.
#     NOTE: BACKEND_JWT_SECRET is a new repo secret this job depends on — not
#     yet added to this repo's Actions secrets as of this commit.
#
# STATUS (2026-09-11): added an OPTIONAL step, right after the JWT_SECRET
# one, that pushes REVIEW_ADMIN_USERNAME / REVIEW_ADMIN_PASSWORD_HASH (the
# review-admin root-login credentials from migration 0009 / review-admin.ts)
# to the Worker the same way -- but unlike JWT_SECRET this pair is NOT in the
# job's required-secrets fail-fast check, and deliberately so: root-admin
# login is an opt-in convenience on top of the DB-backed review_admins table
# (review-admin.ts's own login handler treats REVIEW_ADMIN_USERNAME/HASH as
# optional -- it just falls through to the DB lookup when either is unset),
# so a deploy must keep succeeding for repos/environments that never
# configure a root admin at all. The new step instead guards itself on both
# secrets being non-empty and only then runs `wrangler secret put` for each
# -- if only one of the pair is set, or neither, the step is skipped
# entirely rather than failing or pushing a half-configured pair. Like the
# existing JWT_SECRET step, `wrangler secret put` is idempotent against a
# repeat run with the same value, so this is safe to run on every deploy.
#
# STATUS (2026-09-10, later same day): the D1 database itself is now
# auto-provisioned rather than requiring a one-time manual
# `wrangler d1 create` before first deploy. Both `backend-migrate` and
# `backend` now run the `./.github/actions/ensure-d1-database` composite
# action (right after their secret-presence check, before touching D1):
# it looks the database up by name via `wrangler d1 list` and only creates
# it if that lookup finds nothing — the guard against recreating it on every
# redeploy — then patches THAT JOB'S OWN local checkout of
# apps/backend/wrangler.toml with the real id. This patch is never committed
# back to the repo: apps/backend/wrangler.toml's committed database_id stays
# a placeholder forever, and every job run resolves the real id fresh via
# the same idempotent lookup. See the action's own file for the full
# rationale and a note on its defensive --json parsing (untested against a
# real Cloudflare account as of this commit — verify the parsing holds on
# the first actual run and adjust if wrangler's JSON shape differs).
#
# Per-app path filtering: each job only runs (typecheck + test + deploy) if
# its own apps/<name>/** folder changed, OR packages/**  changed (shared code
# affects every app that depends on it), or this workflow file itself changed.
# A manual workflow_dispatch run always runs all wired-up jobs, since there's
# no "changed files" diff to compare against for a manual trigger.
#
# On pull_request: typecheck + test only, as a CI gate — no deploy.
# On push to main: typecheck + test, then deploy — only for apps whose files
# (or a shared package they depend on) were touched by that push.
#
# STATUS (2026-09-10): the separate sync-lockfile.yml workflow has been
# folded into this file as the `sync-lockfile` job below, which now runs
# FIRST on every trigger, before `changes` or anything else. Rationale for
# folding it in rather than keeping it standalone: it needs to gate the same
# `changes`/build/deploy pipeline rather than run as a fully independent
# workflow.
#
# Trigger shape already gives us what we want with no changes needed there:
# `push` is scoped to `branches: [main]` only, so a plain push to a feature
# branch never runs this workflow at all (no wasted lockfile-check runs on
# every commit) — it only runs once a PR against main exists, via the
# `pull_request` trigger (opened/synchronize/reopened, GitHub's defaults).
# Once on main, every push re-runs the full pipeline including the lockfile
# check, since push IS scoped to main.
#
# sync-lockfile job behavior by event:
#   - pull_request: checks out the PR's own head branch, runs `npm install`,
#     and if package-lock.json comes out different, commits and pushes that
#     fix DIRECTLY onto the PR branch (no separate PR needed — it's already
#     on one). That push triggers a fresh `pull_request: synchronize` run;
#     THIS run's `changes` job (and therefore every downstream job) is
#     skipped via the `committed` output, since the new run supersedes it.
#   - push (main) / workflow_dispatch: same rebase-onto-live-main +
#     branch + PR + squash-merge dance the old standalone workflow used —
#     preserved because a direct push to main is expected to be blocked by
#     branch protection. That merge triggers a fresh `push` run on main;
#     again this run's downstream jobs are skipped via `committed`.
#   - Either way, if the lockfile was already in sync, `committed` is
#     `false` and the pipeline proceeds normally in the SAME run — no extra
#     round trip when there's nothing to fix.
#
# NOTE: pushing back to a PR branch with the default GITHUB_TOKEN only works
# for branches in this same repo (not forks) — consistent with the
# `gh pr create`/`gh pr merge` path already depending on this repo's own
# Actions settings.

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# NOTE: concurrency is scoped per-job (see each job below), not at workflow
# level — a single shared group would let an unrelated push (e.g. a
# customer-app-only change, once that app exists) cancel an in-flight
# business-owner deploy from a previous commit, silently stranding it
# mid-deploy. See raffle-app's deploy.yml for the incident this guards against.

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      committed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout PR head branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Checkout main
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Workspaces-aware: resolves/hoists deps for every apps/* and
      # packages/* workspace into one root package-lock.json. Deliberately
      # `npm install`, not `npm ci` — there may be no lockfile yet at all,
      # or it may be stale relative to a just-changed package.json.
      - run: npm install

      - name: Check for lockfile changes
        id: diff
        run: |
          # git diff alone misses a brand-new (untracked) lockfile -- status
          # --porcelain catches both "modified" and "never existed before".
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit lockfile directly onto the PR branch
        if: steps.diff.outputs.changed == 'true' && github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync package-lock.json"
          git push origin HEAD:${{ github.head_ref }}

      # push-to-main / workflow_dispatch path: mirrors the old standalone
      # sync-lockfile.yml exactly, including rebasing onto the LIVE tip of
      # main right before regenerating (guards against a race with another
      # push landing on main mid-run — see the incident note this same
      # rationale used to carry in the standalone file) and going through a
      # PR + squash-merge rather than a direct push, since main is expected
      # to have branch protection that would reject a direct bot push.
      - name: Rebase onto latest main, commit, open PR, and merge
        if: steps.diff.outputs.changed == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          BRANCH="lockfile-sync-${{ github.run_id }}"
          git checkout -B "$BRANCH" origin/main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm install
          git add package-lock.json
          git commit -m "chore: sync package-lock.json"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: sync package-lock.json" \
            --body "Auto-generated by the sync-lockfile job — a package.json changed, so the workspace-root package-lock.json was regenerated to match. Merging automatically since this is a machine-generated, additive lockfile update with no source changes."
          gh pr merge "$BRANCH" --squash --delete-branch

  changes:
    needs: sync-lockfile
    # Skip this run's build/deploy pipeline entirely if sync-lockfile just
    # committed a fix — that commit (whether pushed straight to the PR
    # branch or merged to main) triggers its own fresh run that will see a
    # lockfile already in sync and proceed normally. Running the full
    # pipeline twice against a lockfile we know is about to be superseded
    # would be wasted work at best and a stale-lockfile build at worst.
    if: needs.sync-lockfile.outputs.committed != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      business_owner: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.business_owner == 'true' }}
      customer: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.customer == 'true' }}
      staff_pos: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.staff_pos == 'true' }}
      review_console: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.review_console == 'true' }}
      microsite: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.microsite == 'true' }}
      deploy_index: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.deploy_index == 'true' }}
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      backend_migrations: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend_migrations == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            business_owner:
              - 'apps/business-owner/**'
              - 'packages/**'
              - 'package.json'
              - '.github/workflows/deploy.yml'
            customer:
              - 'apps/customer/**'
              - 'packages/**'
              - 'package.json'
              - '.github/workflows/deploy.yml'
            staff_pos:
              - 'apps/staff-pos/**'
              - 'packages/**'
              - 'package.json'
              - '.github/workflows/deploy.yml'
            review_console:
              - 'apps/review-console/**'
              - 'packages/**'
              - 'package.json'
              - '.github/workflows/deploy.yml'
            microsite:
              - 'apps/microsite/**'
              - 'packages/**'
              - 'package.json'
              - '.github/workflows/deploy.yml'
            deploy_index:
              - 'apps/deploy-index/**'
              - 'package.json'
              - '.github/workflows/deploy.yml'
            backend:
              - 'apps/backend/**'
              - 'package.json'
              - '.github/workflows/deploy.yml'
            backend_migrations:
              - 'apps/backend/migrations/**'
              - '.github/workflows/deploy.yml'

  business-owner:
    needs: changes
    if: needs.changes.outputs.business_owner == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-business-owner-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck --workspace=apps/business-owner
      - run: npm test --workspace=apps/business-owner
      - run: npm run build --workspace=apps/business-owner
      - name: Deploy
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy --workspace=apps/business-owner

  customer:
    needs: changes
    if: needs.changes.outputs.customer == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-customer-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck --workspace=apps/customer
      - run: npm test --workspace=apps/customer
      - run: npm run build --workspace=apps/customer
      - name: Deploy
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy --workspace=apps/customer

  staff-pos:
    needs: changes
    if: needs.changes.outputs.staff_pos == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staff-pos-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck --workspace=apps/staff-pos
      - run: npm test --workspace=apps/staff-pos
      - run: npm run build --workspace=apps/staff-pos
      - name: Deploy
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy --workspace=apps/staff-pos

  review-console:
    needs: changes
    if: needs.changes.outputs.review_console == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-review-console-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck --workspace=apps/review-console
      - run: npm test --workspace=apps/review-console
      - run: npm run build --workspace=apps/review-console
      - name: Deploy
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy --workspace=apps/review-console

  microsite:
    needs: changes
    if: needs.changes.outputs.microsite == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-microsite-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck --workspace=apps/microsite
      - run: npm test --workspace=apps/microsite
      - run: npm run build --workspace=apps/microsite
      - name: Deploy
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy --workspace=apps/microsite

  deploy-index:
    needs: changes
    if: needs.changes.outputs.deploy_index == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-deploy-index-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck --workspace=apps/deploy-index
      - run: npm test --workspace=apps/deploy-index
      - run: npm run build --workspace=apps/deploy-index
      - name: Deploy
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy --workspace=apps/deploy-index

  backend-migrate:
    needs: changes
    # Migrations only ever run on an actual deploy trigger, never on a PR
    # check, and only when apps/backend/migrations/** itself changed (a
    # narrower filter than the backend job's, so backend code-only changes
    # don't re-run migrations, and vice versa).
    if: needs.changes.outputs.backend_migrations == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: migrate-backend-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Check required secrets present
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID repo secret(s) -- cannot run D1 migrations. Aborting before touching the database."
            exit 1
          fi
      - name: Ensure D1 database exists
        uses: ./.github/actions/ensure-d1-database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply D1 migrations (remote)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:migrate:remote --workspace=apps/backend

  backend:
    needs: [changes, backend-migrate]
    # Proceed if this app's own files changed, AND (backend-migrate wasn't
    # needed at all -> 'skipped', or it ran and passed -> 'success'). The
    # always() is required here because a skipped dependency job would
    # otherwise cause this job to be skipped too by GitHub Actions' default
    # "needs" behavior.
    if: always() && needs.changes.outputs.backend == 'true' && (needs.backend-migrate.result == 'success' || needs.backend-migrate.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-backend-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck --workspace=apps/backend
      - run: npm test --workspace=apps/backend
      - name: Check required secrets present
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] || [ -z "${{ secrets.BACKEND_JWT_SECRET }}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and/or BACKEND_JWT_SECRET repo secret(s) -- aborting before deploying a backend that would be missing its JWT_SECRET binding."
            exit 1
          fi
      - name: Ensure D1 database exists
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/ensure-d1-database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy --workspace=apps/backend
      - name: Set JWT_SECRET on the deployed Worker
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: cd apps/backend && echo "${{ secrets.BACKEND_JWT_SECRET }}" | npx wrangler secret put JWT_SECRET
