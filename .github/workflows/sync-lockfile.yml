# Regenerates the workspace-root package-lock.json whenever any package.json
# in the monorepo changes, and merges the update straight to main.
#
# WHY THIS EXISTS: this repo uses npm workspaces (root package.json +
# apps/*/package.json + packages/*/package.json), which means there is a
# SINGLE root package-lock.json covering the whole tree. No lockfile has ever
# been committed, so every `npm ci` step in deploy.yml fails with EUSAGE
# ("can only install with an existing package-lock.json") — confirmed via
# workflow run history on 2026-09-09. This workflow keeps that lockfile in
# sync going forward.
#
# NO INFINITE-LOOP RISK: this workflow only ever commits package-lock.json,
# never package.json, so its own merge to main never re-triggers itself (the
# path filter below only matches package.json files).
#
# ONE-TIME BACKFILL NEEDED: this only *triggers* on a package.json change, so
# it won't retroactively fix a lockfile that's already missing on main with
# no new push to react to. Run it once via workflow_dispatch to backfill
# immediately.
#
# PREREQUISITE: repo setting "Allow GitHub Actions to create and approve pull
# requests" (Settings -> Actions -> General) must be enabled for the
# `gh pr create` / `gh pr merge` steps below to succeed. If branch protection
# on `main` requires reviews or specific status checks, the final merge step
# will fail (visibly, in the job log) rather than silently bypassing them —
# adjust branch protection or this workflow together if that happens.

name: Sync lockfile

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'apps/*/package.json'
      - 'packages/*/package.json'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Rebuild the working branch from the LIVE tip of main, right before
      # regenerating the lockfile — not the possibly-stale commit this job
      # was triggered from. If another push (e.g. touching
      # .github/workflows/**) lands on main while this job is running, a
      # branch based on the older commit would push a tree that looks like
      # it "reverts" that other file — and GitHub's GITHUB_TOKEN is
      # hard-blocked from creating/updating workflow files, no matter what
      # `permissions:` says, so that push is silently (well, loudly) rejected.
      # Rebasing onto origin/main right here means our branch's tree is
      # always IDENTICAL to current main except for package-lock.json, so it
      # can never trip that protection. (Root-caused 2026-09-09: run #9
      # failed this exact way when a package.json push and a deploy.yml push
      # landed within seconds of each other.)
      - name: Rebase onto latest main
        run: |
          git fetch origin main
          BRANCH="lockfile-sync-${{ github.run_id }}"
          git checkout -B "$BRANCH" origin/main
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"

      # Workspaces-aware: resolves/hoists deps for every apps/* and
      # packages/* workspace into one root package-lock.json. Deliberately
      # `npm install`, not `npm ci` — there may be no lockfile yet at all,
      # or it may be stale relative to a just-changed package.json.
      - run: npm install

      - name: Check for lockfile changes
        id: diff
        run: |
          # git diff alone misses a brand-new (untracked) lockfile -- status
          # --porcelain catches both "modified" and "never existed before".
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit, open PR, and merge to main
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # BRANCH was already created (based on the live main tip) and
          # exported to $GITHUB_ENV in the "Rebase onto latest main" step
          # above — reused here rather than re-derived, so this step commits
          # to the exact branch that was just rebased.
          git add package-lock.json
          git commit -m "chore: sync package-lock.json"
          git push origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: sync package-lock.json" \
            --body "Auto-generated by the Sync lockfile workflow — a package.json changed on main, so the workspace-root package-lock.json was regenerated to match. Merging automatically since this is a machine-generated, additive lockfile update with no source changes."

          gh pr merge "$BRANCH" --squash --delete-branch
