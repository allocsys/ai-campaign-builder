name: 'Ensure KV namespace exists'
description: >
  Idempotently ensures a Cloudflare Workers KV namespace exists and patches
  this job's own (uncommitted) checkout of apps/backend/wrangler.toml with
  the real namespace id, so wrangler commands in the SAME job run against
  the real namespace instead of the placeholder id committed to the repo.
  Direct mirror of ./.github/actions/ensure-d1-database -- see that action's
  own comments for the fuller rationale; only the wrangler subcommands and
  JSON shape differ (kv namespace list/create vs d1 list/create).

  GUARD AGAINST RECREATION ON REDEPLOY: this looks the namespace up by title
  via `wrangler kv namespace list` first and only calls
  `wrangler kv namespace create` if that lookup finds nothing. On every run
  after the first, the lookup finds the existing namespace and reuses its
  id -- `wrangler kv namespace create` is never called again once the
  namespace exists.

  NOT COMMITTED BACK TO THE REPO: the wrangler.toml edit only exists in this
  job's own checkout. apps/backend/wrangler.toml on disk in the repo keeps
  its placeholder value forever (it's documentation, not live config) --
  every job run that needs it resolves the real id fresh via this same
  idempotent lookup, independently, since jobs run in separate checkouts.

inputs:
  namespace-title:
    description: 'Title of the KV namespace (wrangler namespace-create argument -- becomes "<worker-name>-<title>" as the namespace title on the Cloudflare account)'
    required: true
    default: 'CHAT_HISTORY'

runs:
  using: 'composite'
  steps:
    - name: Look up or create the KV namespace, then patch this checkout's wrangler.toml
      shell: bash
      working-directory: apps/backend
      run: |
        set -euo pipefail
        NS_TITLE="${{ inputs.namespace-title }}"

        # ROOT CAUSE (confirmed 2026-09-14, after two failed defensive-parsing
        # attempts): `wrangler kv namespace list --json` is NOT a valid
        # invocation on the installed wrangler version. Per Cloudflare's own
        # docs, `wrangler kv namespace list` returns a JSON array of
        # namespace objects (id + title) BY DEFAULT now -- there is no
        # --json flag for this subcommand at all. Passing the unrecognized
        # --json flag doesn't error; it makes wrangler print this
        # subcommand's help/usage text to stdout instead (yargs behavior),
        # which is exactly what broke JSON.parse here, in both previous
        # "defensive parsing" attempts -- the failure was never actually
        # about leading preamble text before valid JSON, it was that there
        # was never any JSON in the output at all. Fix: drop --json --
        # `wrangler kv namespace list` alone already returns JSON.
        #
        # Kept the defensive parsing (try every '[' / '{' start position,
        # not just the first) and the diagnostic dump-raw-output-on-failure
        # behavior from the prior attempt as a safety net against some
        # OTHER future wrangler output-format change -- low cost, and it's
        # what actually surfaced this root cause in the Actions log instead
        # of a truncated, unhelpful error message.
        EXISTING_ID=$(npx wrangler kv namespace list | node -e "
          const raw = require('fs').readFileSync(0, 'utf8');
          const candidates = [];
          for (let i = 0; i < raw.length; i++) {
            if (raw[i] === '[' || raw[i] === '{') candidates.push(i);
          }
          let parsed;
          for (const idx of candidates) {
            try {
              parsed = JSON.parse(raw.slice(idx));
              break;
            } catch (e) { /* try the next candidate start */ }
          }
          if (parsed === undefined) {
            process.stderr.write('Could not find valid JSON in wrangler kv namespace list output. Raw output (first 1000 chars): ' + JSON.stringify(raw.slice(0, 1000)) + require('os').EOL);
            process.exit(1);
          }
          const list = Array.isArray(parsed) ? parsed : (parsed.result || []);
          const match = list.find(ns => typeof ns.title === 'string' && ns.title.includes(process.argv[1]));
          process.stdout.write(match ? (match.id || match.namespace_id || '') : '');
        " "$NS_TITLE")

        if [ -n "$EXISTING_ID" ]; then
          echo "::add-mask::$EXISTING_ID"
          echo "KV namespace matching '$NS_TITLE' already exists (id: [masked]) -- skipping creation."
          NS_ID="$EXISTING_ID"
        else
          echo "KV namespace matching '$NS_TITLE' not found for this account -- creating it now. This should only happen once, on the very first deploy."
          # Mirrors ensure-d1-database's own note: don't assume `create`
          # supports --json on the pinned wrangler version -- re-run the
          # same list-based lookup afterward to resolve the id instead of
          # parsing create's own output directly.
          npx wrangler kv namespace create "$NS_TITLE"
          NS_ID=$(npx wrangler kv namespace list | node -e "
            const raw = require('fs').readFileSync(0, 'utf8');
            const candidates = [];
            for (let i = 0; i < raw.length; i++) {
              if (raw[i] === '[' || raw[i] === '{') candidates.push(i);
            }
            let parsed;
            for (const idx of candidates) {
              try {
                parsed = JSON.parse(raw.slice(idx));
                break;
              } catch (e) { /* try the next candidate start */ }
            }
            if (parsed === undefined) {
              process.stderr.write('Could not find valid JSON in wrangler kv namespace list output. Raw output (first 1000 chars): ' + JSON.stringify(raw.slice(0, 1000)) + require('os').EOL);
              process.exit(1);
            }
            const list = Array.isArray(parsed) ? parsed : (parsed.result || []);
            const match = list.find(ns => typeof ns.title === 'string' && ns.title.includes(process.argv[1]));
            process.stdout.write(match ? (match.id || match.namespace_id || '') : '');
          " "$NS_TITLE")
          if [ -z "$NS_ID" ]; then
            echo "::error::Created the KV namespace via 'wrangler kv namespace create' but couldn't find it afterward via a 'wrangler kv namespace list' lookup by title '$NS_TITLE'. The namespace now exists in Cloudflare -- check manually before retrying (the lookup branch above should find it and skip recreation on the next run)."
            exit 1
          fi
          echo "::add-mask::$NS_ID"
          echo "Created KV namespace matching '$NS_TITLE' (id: [masked])."
        fi

        sed -i "s/id = \"REPLACE_WITH_REAL_KV_NAMESPACE_ID\"/id = \"$NS_ID\"/" wrangler.toml
        echo "This job's local wrangler.toml now points at the real KV namespace id (not committed back to the repo -- see this action's description)."
